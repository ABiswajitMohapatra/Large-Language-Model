<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>BiswaLex AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BiswaLex">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #0f0f11;
    --panel: #17171a;
    --panel-2: #1e1e22;
    --border: #2a2a2e;
    --text: #e8e8ea;
    --text-dim: #9a9aa2;
    --accent: #7c5cff;
    --accent-2: #5a3fe0;
    --user-bubble: #2b2b30;
    --code-bg: #0b0b0d;
    --inline-code-bg: #262629;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f7f7f8;
    --panel-2: #eeeef0;
    --border: #e2e2e5;
    --text: #1a1a1e;
    --text-dim: #6b6b73;
    --accent: #7c5cff;
    --accent-2: #5a3fe0;
    --user-bubble: #eeeef0;
    --code-bg: #f2f2f4;
    --inline-code-bg: #e8e8eb;
  }
  * { box-sizing: border-box; }
  html, body, #sidebar, #topbar, .bubble pre, .bubble :not(pre) > code,
  .msg-row.user .bubble, #input-wrap, .history-item, #theme-toggle button {
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    flex-shrink: 0;
    transition: margin-left .25s ease;
  }
  #sidebar.hidden { margin-left: -260px; }
  #brand {
    display: flex; align-items: center; gap: 9px;
    padding: 4px 4px 14px;
    margin-bottom: 2px;
  }
  #brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px;
    box-shadow: 0 2px 8px rgba(124,92,255,.35);
  }
  #brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
  #brand-tag { font-size: 11px; color: var(--text-dim); }
  .new-chat-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
    padding: 11px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(124,92,255,.3);
  }
  .new-chat-btn:hover { filter: brightness(1.08); box-shadow: 0 3px 14px rgba(124,92,255,.45); }
  .new-chat-btn svg { width: 15px; height: 15px; }
  #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .history-group-label {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .04em;
    padding: 12px 10px 4px;
    display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;
  }
  .history-group-label:first-child { padding-top: 4px; }
  .history-group-label .chev { width: 10px; height: 10px; transition: transform .15s ease; flex-shrink: 0; }
  .history-group.collapsed .chev { transform: rotate(-90deg); }
  .history-group.collapsed .history-item { display: none; }
  .history-item {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    position: relative;
  }
  .history-item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item:hover, .history-item.active { background: var(--panel-2); color: var(--text); }
  .history-item .pin-badge { font-size: 11px; flex-shrink: 0; }
  .history-item .kebab-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    padding: 3px; border-radius: 5px; flex-shrink: 0; opacity: 0; font-size: 14px; line-height: 1;
  }
  .history-item:hover .kebab-btn, .history-item.menu-open .kebab-btn { opacity: 1; }
  .kebab-btn:hover { background: var(--border); color: var(--text); }
  .history-menu {
    position: absolute; right: 6px; top: calc(100% + 2px); z-index: 40;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; min-width: 130px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    display: none;
  }
  .history-menu.open { display: block; }
  .history-menu button {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text); font-size: 13px;
    padding: 7px 8px; border-radius: 6px; cursor: pointer;
  }
  .history-menu button:hover { background: var(--border); }
  .history-menu button.danger { color: #f87171; }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #menu-toggle {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 18px; padding: 6px;
  }
  #model-name { font-weight: 600; font-size: 14px; }
  #model-sub { color: var(--text-dim); font-size: 12px; }
  #model-select {
    background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; padding: 2px 6px; margin-top: 2px;
    cursor: pointer; outline: none; max-width: 220px;
  }
  #model-select:hover, #model-select:focus { color: var(--text); border-color: var(--accent); }
  #topbar-spacer { flex: 1; }
  #token-counter {
    font-size: 11px; color: var(--text-dim); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  #token-counter .bar {
    width: 40px; height: 4px; border-radius: 3px; background: var(--border); overflow: hidden;
  }
  #token-counter .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s ease; }
  #export-wrap { position: relative; }
  #export-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 11px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  #export-btn:hover { background: var(--border); }
  #export-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; min-width: 170px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    display: none;
  }
  #export-menu.open { display: block; }
  #export-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text); font-size: 13px;
    padding: 8px; border-radius: 6px; cursor: pointer;
  }
  #export-menu button:hover { background: var(--border); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0 12px 0;
  }
  #empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    text-align: center;
  }
  #empty-state.hidden { display: none; }
  #empty-mark {
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 20px;
    box-shadow: 0 4px 18px rgba(124,92,255,.35);
  }
  #empty-greeting {
    font-size: 26px; font-weight: 600; letter-spacing: -.3px;
    max-width: 560px;
  }
  #empty-sub { color: var(--text-dim); font-size: 14px; margin-top: -8px; }
  #suggestion-grid {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    max-width: 620px; margin-top: 6px;
  }
  #shared-banner {
    display: none;
    align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    padding: 10px 16px; font-size: 13px; color: var(--text-dim);
  }
  #shared-banner.show { display: flex; }
  #shared-banner button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff; padding: 7px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .suggestion-chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 12px; font-size: 13px; cursor: pointer;
    text-align: left; max-width: 260px;
  }
  .suggestion-chip:hover { border-color: var(--accent); background: var(--panel); }
  .msg-row { display: flex; align-items: flex-start; padding: 14px 18px; gap: 10px; max-width: 820px; margin: 0 auto; }
  .msg-row.user { justify-content: flex-end; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
  }
  .avatar svg { width: 16px; height: 16px; }
  .avatar.assistant { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .avatar.user { background: #3a3a40; color: #cfcfd4; }
  .bubble {
    line-height: 1.65;
    font-size: 15px;
    max-width: 640px;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    padding: 10px 14px;
    border-radius: 14px;
  }
  .bubble p { margin: 0 0 10px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: #0b0b0d; border: 1px solid #2a2a2e;
    border-radius: 10px; padding: 12px 12px 12px; overflow-x: auto; font-size: 13px;
    position: relative; margin: 8px 0;
  }
  .bubble pre code { color: #e8e8ea; }
  .code-block-wrap { position: relative; }
  .code-block-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; background: #151517; border: 1px solid #2a2a2e; border-bottom: none;
    border-radius: 10px 10px 0 0; font-size: 12px; color: #9a9aa2;
  }
  .code-block-header + pre { border-radius: 0 0 10px 10px; margin-top: 0; }
  .copy-code-btn {
    background: none; border: 1px solid #35353a; color: #9a9aa2;
    border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .copy-code-btn:hover { color: #e8e8ea; border-color: #4a4a52; }
  .copy-code-btn:focus-visible, .actions button:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .copy-code-btn.copied { color: #4ade80; border-color: #4ade80; }
  .bubble code { font-family: "SF Mono", Menlo, monospace; }
  .bubble :not(pre) > code {
    background: var(--inline-code-bg); padding: 2px 5px; border-radius: 4px; font-size: 13px;
  }
  .bubble img { max-width: 100%; border-radius: 10px; display: block; margin: 8px 0; }
  .bubble table {
    border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px;
    display: block; overflow-x: auto;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border); padding: 7px 10px; text-align: left;
  }
  .bubble th { background: var(--panel-2); font-weight: 600; }
  .bubble tr:nth-child(even) td { background: rgba(124,92,255,.04); }
  .bubble .katex-display { overflow-x: auto; overflow-y: hidden; margin: 10px 0; padding: 4px 0; }
  .bubble .katex { font-size: 1.05em; }
  .img-wrap { position: relative; display: inline-block; max-width: 100%; }
  .img-actions {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 6px;
    opacity: 0; transition: opacity .15s ease;
  }
  .img-wrap:hover .img-actions { opacity: 1; }
  .img-actions button {
    background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); color: #fff;
    border-radius: 6px; width: 28px; height: 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .img-actions button:hover { background: rgba(0,0,0,.85); }

  /* Tooltip */
  [data-tooltip] { position: relative; }
  [data-tooltip]:hover::after, [data-tooltip]:focus-visible::after {
    content: attr(data-tooltip);
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    background: #1a1a1e; color: #e8e8ea; font-size: 11px; padding: 4px 8px;
    border-radius: 6px; white-space: nowrap; z-index: 30; pointer-events: none;
    border: 1px solid #2f2f34;
  }

  /* Theme toggle */
  #theme-toggle {
    display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px; margin-bottom: 10px;
  }
  #theme-toggle button {
    flex: 1; background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 12px; padding: 6px 0; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; gap: 4px;
  }
  #theme-toggle button.active { background: var(--accent); color: #fff; }
  #theme-toggle button:hover:not(.active) { color: var(--text); }

  /* Sidebar search */
  #chat-search-wrap { position: relative; margin-bottom: 10px; }
  #chat-search {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 10px 8px 30px;
    font-size: 13px; outline: none;
  }
  #chat-search:focus { border-color: var(--accent); }
  #chat-search-wrap svg {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text-dim); pointer-events: none;
  }
  .history-item mark { background: var(--accent); color: #fff; border-radius: 3px; padding: 0 1px; }
  #no-results { padding: 10px; font-size: 12px; color: var(--text-dim); text-align: center; }
  .actions { display: flex; gap: 6px; margin-top: 8px; opacity: .5; }
  .actions button {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 6px;
  }
  .actions button:hover { color: var(--text); background: var(--panel-2); }
  .msg-row:hover .actions { opacity: 1; }

  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--text-dim); margin-left: 2px; animation: blink 1s step-start infinite; vertical-align: text-bottom;}
  @keyframes blink { 50% { opacity: 0; } }

  .typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input */
  #input-area { padding: 12px 18px 20px; }
  #input-wrap {
    max-width: 780px; margin: 0 auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 12px;
    display: flex; align-items: flex-end; gap: 8px;
  }
  #input-wrap:focus-within { border-color: var(--accent); }
  #user-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 15px; resize: none;
    max-height: 200px; font-family: inherit; padding: 6px 4px;
  }
  #send-btn, #attach-btn {
    background: var(--accent);
    border: none; color: white; width: 34px; height: 34px;
    border-radius: 10px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  #attach-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); }
  #mic-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); }
  #mic-btn.recording { background: #ef4444; border-color: #ef4444; color: #fff; animation: mic-pulse 1.2s infinite; }
  @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
  #send-btn.stop-mode { background: #ef4444; }
  #send-btn:disabled { opacity: .4; cursor: not-allowed; }
  #hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  #file-chip {
    max-width: 780px; margin: 0 auto 6px; font-size: 12px; color: var(--text-dim);
    display: none; align-items: center; gap: 6px;
  }
  #file-chip.show { display: flex; }

  /* Backdrop for mobile drawer */
  #sidebar-backdrop {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 19; opacity: 0; transition: opacity .25s ease;
  }
  #sidebar-backdrop.show { display: block; opacity: 1; }

  @media (max-width: 768px) {
    #sidebar {
      position: fixed; z-index: 20; top: 0; left: 0; height: 100dvh;
      width: min(300px, 84vw);
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      box-shadow: 2px 0 24px rgba(0,0,0,.35);
    }
    #sidebar:not(.hidden) { margin-left: 0; }
    #sidebar.hidden { margin-left: min(-300px, -84vw); }

    #topbar {
      height: calc(52px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: calc(12px + env(safe-area-inset-left));
      padding-right: calc(12px + env(safe-area-inset-right));
    }
    #menu-toggle { min-width: 40px; min-height: 40px; font-size: 20px; }
    #export-btn span, #export-btn { font-size: 12px; padding: 7px 9px; }

    .msg-row { max-width: 100%; padding: 10px 12px; }
    .bubble { max-width: 100%; }
    .actions { opacity: 1; }

    #empty-greeting { font-size: 21px; }
    .suggestion-chip { max-width: 90vw; }

    #input-area {
      padding: 10px calc(10px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    }
    #user-input { font-size: 16px; }
    #send-btn, #attach-btn, #mic-btn { width: 40px; height: 40px; }

    .history-item { padding: 11px 10px; }
    .kebab-btn { opacity: 1; padding: 6px; }
    .history-menu { min-width: 150px; }
  }

  @media (display-mode: standalone) {
    #hint { padding-bottom: env(safe-area-inset-bottom); }
  }
</style>

</head>
<body>

<div id="sidebar-backdrop" onclick="toggleSidebar()"></div>
<div id="sidebar">
  <div id="brand">
    <div id="brand-mark">BL</div>
    <div>
      <div id="brand-name">BiswaLex</div>
      <div id="brand-tag">AI Assistant</div>
    </div>
  </div>
  <div id="theme-toggle" role="group" aria-label="Theme selector">
    <button data-theme-btn="light" onclick="setTheme('light')" data-tooltip="Light theme" aria-label="Light theme">☀️</button>
    <button data-theme-btn="dark" onclick="setTheme('dark')" data-tooltip="Dark theme" aria-label="Dark theme">🌙</button>
    <button data-theme-btn="system" onclick="setTheme('system')" data-tooltip="Match system" aria-label="System theme">💻</button>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    New chat
  </button>
  <div id="chat-search-wrap">
    <svg viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="chat-search" type="text" placeholder="Search chats..." oninput="filterHistory(this.value)" aria-label="Search chats">
  </div>
  <div id="history-list"></div>
  <div class="sidebar-footer">BiswaLex &middot; Powered by Groq</div>
</div>

<div id="main">
  <div id="topbar">
    <button id="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
    <div>
      <div id="model-name">BiswaLex</div>
      <select id="model-select" onchange="onModelChange(this.value)" aria-label="Choose AI model">
        <option value="">Loading models...</option>
      </select>
    </div>
    <div id="topbar-spacer"></div>
    <div id="token-counter" data-tooltip="Estimated context usage">
      <span class="bar"><span class="bar-fill" id="token-bar-fill" style="width:0%"></span></span>
      <span id="token-text">~0 tokens</span>
    </div>
    <div id="export-wrap">
      <button id="export-btn" onclick="toggleExportMenu(event)" data-tooltip="Export chat" aria-label="Export chat">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export
      </button>
      <div id="export-menu">
        <button onclick="shareChatLink()">🔗 Share as link</button>
        <button onclick="exportMarkdown()">📝 Export as Markdown</button>
        <button onclick="exportPDF()">📄 Export as PDF</button>
      </div>
    </div>
  </div>

  <div id="shared-banner">
    <span>👁️ Viewing a shared conversation (read-only)</span>
    <button onclick="exitSharedView()">Start my own chat</button>
  </div>
  <div id="messages">
    <div id="empty-state">
      <div id="empty-greeting"></div>
      <div id="empty-sub">Ask anything — from quick questions to full documents.</div>
      <div id="suggestion-grid"></div>
    </div>
  </div>

  <div id="input-area">
    <div id="file-chip"><span>📎</span><span id="file-name"></span><button onclick="clearFile()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;">✕</button></div>
    <div id="input-wrap">
      <button id="attach-btn" onclick="document.getElementById('file-input').click()" data-tooltip="Attach file" aria-label="Attach file">📎</button>
      <input type="file" id="file-input" style="display:none" onchange="handleFile(event)">
      <textarea id="user-input" rows="1" placeholder="Message BiswaLex..." onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      <button id="mic-btn" onclick="toggleVoiceInput()" data-tooltip="Voice input" aria-label="Voice input">
        <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="send-btn" onclick="sendOrStop()">➤</button>
    </div>
    <div id="hint">BiswaLex can make mistakes. Verify important info.</div>
  </div>
</div>

<script>
// ====== CONFIG ======
const API_URL = "https://biswajitmohapatra-biswalex-llm.hf.space";
// =====================

let history = [];
let extraFileContent = "";
let isStreaming = false;
let conversations = [];
let currentConvId = null;
let selectedModel = localStorage.getItem('biswalex_model') || "";

// ---------- MODEL SELECTOR ----------
async function loadModels() {
  const select = document.getElementById('model-select');
  try {
    const res = await fetch(API_URL + "/models");
    const data = await res.json();
    select.innerHTML = data.models.map(m =>
      `<option value="${m.id}">${m.label}</option>`
    ).join('');
    // Restore saved choice if still valid, else fall back to server default.
    const saved = localStorage.getItem('biswalex_model');
    const validIds = data.models.map(m => m.id);
    selectedModel = (saved && validIds.includes(saved)) ? saved : data.default;
    select.value = selectedModel;
  } catch (e) {
    select.innerHTML = `<option value="">Default model</option>`;
  }
}

function onModelChange(modelId) {
  selectedModel = modelId;
  localStorage.setItem('biswalex_model', modelId);
}

loadModels();

// ---------- TOKEN / USAGE ESTIMATE ----------
const CONTEXT_LIMIT = 8192; // display reference only; actual model limit may differ

function estimateTokens() {
  const chars = history.reduce((sum, m) => sum + (m.message ? m.message.length : 0), 0);
  return Math.round(chars / 4); // rough heuristic: ~4 chars per token
}

function updateTokenCounter() {
  const tokens = estimateTokens();
  const pct = Math.min(100, Math.round((tokens / CONTEXT_LIMIT) * 100));
  const fill = document.getElementById('token-bar-fill');
  const text = document.getElementById('token-text');
  if (!fill || !text) return;
  fill.style.width = pct + '%';
  fill.style.background = pct > 85 ? '#ef4444' : pct > 60 ? '#f59e0b' : 'var(--accent)';
  text.textContent = `~${tokens >= 1000 ? (tokens / 1000).toFixed(1) + 'k' : tokens} tokens`;
}

// ---------- THEME ----------
function applyTheme(theme) {
  const resolved = theme === 'system'
    ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : theme;
  document.documentElement.setAttribute('data-theme', resolved);
  document.querySelectorAll('#theme-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.themeBtn === theme);
  });
}

function setTheme(theme) {
  localStorage.setItem('biswalex_theme', theme);
  applyTheme(theme);
}

function initTheme() {
  const saved = localStorage.getItem('biswalex_theme') || 'dark';
  applyTheme(saved);
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if ((localStorage.getItem('biswalex_theme') || 'dark') === 'system') applyTheme('system');
  });
}
initTheme();

// ---------- CONVERSATION HISTORY / SEARCH ----------
function loadConversations() {
  try {
    conversations = JSON.parse(localStorage.getItem('biswalex_conversations') || '[]');
  } catch (e) { conversations = []; }
  renderHistory();
}

function saveConversations() {
  localStorage.setItem('biswalex_conversations', JSON.stringify(conversations));
}

let collapsedGroups = {};
try { collapsedGroups = JSON.parse(localStorage.getItem('biswalex_collapsed') || '{}'); } catch (e) { collapsedGroups = {}; }

function toggleGroup(label) {
  collapsedGroups[label] = !collapsedGroups[label];
  localStorage.setItem('biswalex_collapsed', JSON.stringify(collapsedGroups));
  renderHistory(document.getElementById('chat-search').value);
}

function closeAllHistoryMenus() {
  document.querySelectorAll('.history-menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.history-item.menu-open').forEach(i => i.classList.remove('menu-open'));
}

function toggleHistoryMenu(evt, id) {
  evt.stopPropagation();
  const menu = document.getElementById('menu-' + id);
  const item = menu.closest('.history-item');
  const wasOpen = menu.classList.contains('open');
  closeAllHistoryMenus();
  if (!wasOpen) {
    menu.classList.add('open');
    item.classList.add('menu-open');
  }
}

function renameConversation(evt, id) {
  evt.stopPropagation();
  closeAllHistoryMenus();
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  const name = prompt('Rename chat', conv.title);
  if (name && name.trim()) {
    conv.title = name.trim().slice(0, 60);
    saveConversations();
    renderHistory(document.getElementById('chat-search').value);
  }
}

function togglePinConversation(evt, id) {
  evt.stopPropagation();
  closeAllHistoryMenus();
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  conv.pinned = !conv.pinned;
  saveConversations();
  renderHistory(document.getElementById('chat-search').value);
}

function deleteConversation(evt, id) {
  evt.stopPropagation();
  closeAllHistoryMenus();
  if (!confirm('Delete this chat? This cannot be undone.')) return;
  conversations = conversations.filter(c => c.id !== id);
  saveConversations();
  if (currentConvId === id) newChat();
  renderHistory(document.getElementById('chat-search').value);
}

document.addEventListener('click', (e) => {
  closeAllHistoryMenus();
  if (!e.target.closest('#export-wrap')) {
    document.getElementById('export-menu').classList.remove('open');
  }
});

function toggleExportMenu(evt) {
  evt.stopPropagation();
  document.getElementById('export-menu').classList.toggle('open');
}

function exportMarkdown() {
  document.getElementById('export-menu').classList.remove('open');
  if (history.length === 0) { alert('Nothing to export yet.'); return; }
  let md = `# ${(conversations.find(c => c.id === currentConvId) || {}).title || 'BiswaLex Chat'}\n\n`;
  history.forEach(m => {
    md += `**${m.role === 'user' ? 'You' : 'BiswaLex'}:**\n\n${m.message}\n\n---\n\n`;
  });
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'biswalex-chat.md';
  a.click();
}

// ---------- SHARE VIA LINK ----------
function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

function shareChatLink() {
  document.getElementById('export-menu').classList.remove('open');
  if (history.length === 0) { alert('Nothing to share yet.'); return; }
  const title = (conversations.find(c => c.id === currentConvId) || {}).title || 'Shared chat';
  const payload = { t: title, m: history };
  try {
    const encoded = b64EncodeUnicode(JSON.stringify(payload));
    const url = location.origin + location.pathname + '#share=' + encoded;
    if (url.length > 7500) {
      alert('This chat is too long to share as a link. Try Export instead.');
      return;
    }
    navigator.clipboard.writeText(url);
    alert('Share link copied to clipboard!\n\nAnyone with this link can view this conversation (read-only).');
  } catch (e) {
    alert('Could not generate a share link for this chat.');
  }
}

function exitSharedView() {
  location.hash = '';
  location.reload();
}

function tryRenderSharedView() {
  const hash = location.hash;
  if (!hash.startsWith('#share=')) return false;
  try {
    const encoded = hash.slice(7);
    const payload = JSON.parse(b64DecodeUnicode(encoded));
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('sidebar-backdrop').style.display = 'none';
    document.getElementById('input-area').style.display = 'none';
    document.getElementById('export-wrap').style.display = 'none';
    document.getElementById('menu-toggle').style.display = 'none';
    document.getElementById('model-name').textContent = payload.t || 'Shared chat';
    document.getElementById('shared-banner').classList.add('show');
    hideEmptyState();
    (payload.m || []).forEach(m => addMessage(m.role, m.role === 'user' ? escapeHtml(m.message) : renderMarkdown(m.message)));
    return true;
  } catch (e) {
    return false;
  }
}

function exportPDF() {
  document.getElementById('export-menu').classList.remove('open');
  if (history.length === 0) { alert('Nothing to export yet.'); return; }
  const title = (conversations.find(c => c.id === currentConvId) || {}).title || 'BiswaLex Chat';
  const body = history.map(m => `
    <div style="margin-bottom:16px;">
      <div style="font-weight:700; margin-bottom:4px;">${m.role === 'user' ? 'You' : 'BiswaLex'}</div>
      <div style="white-space:pre-wrap; line-height:1.6;">${renderMarkdown(m.message)}</div>
    </div>`).join('<hr style="border:none;border-top:1px solid #ddd;margin:14px 0;">');
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(title)}</title>
    <style>body{font-family:Arial,sans-serif;color:#111;padding:32px;max-width:720px;margin:0 auto;} h1{font-size:20px;}</style>
    </head><body><h1>${escapeHtml(title)}</h1>${body}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

function renderHistory(filterText = '') {
  const list = document.getElementById('history-list');
  const q = filterText.trim().toLowerCase();
  const sorted = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt);
  const filtered = q
    ? sorted.filter(c =>
        c.title.toLowerCase().includes(q) ||
        c.messages.some(m => m.message.toLowerCase().includes(q)))
    : sorted;

  if (filtered.length === 0) {
    list.innerHTML = `<div id="no-results">${q ? 'No chats match "' + escapeHtml(filterText) + '"' : 'No conversations yet'}</div>`;
    return;
  }

  const highlight = (text) => {
    if (!q) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>' + escapeHtml(text.slice(idx + q.length));
  };

  const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const KEBAB = `<svg viewBox="0 0 24 24" fill="none" width="14" height="14"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>`;

  const itemHtml = (c) => `
    <div class="history-item ${c.id === currentConvId ? 'active' : ''}" tabindex="0" role="button"
         onclick="loadConversation('${c.id}')" onkeydown="if(event.key==='Enter')loadConversation('${c.id}')">
      ${c.pinned ? '<span class="pin-badge">📌</span>' : ''}
      <span class="history-item-title">${highlight(c.title)}</span>
      <button class="kebab-btn" onclick="toggleHistoryMenu(event, '${c.id}')" aria-label="Chat options">${KEBAB}</button>
      <div class="history-menu" id="menu-${c.id}">
        <button onclick="togglePinConversation(event, '${c.id}')">${c.pinned ? '📌 Unpin' : '📌 Pin'}</button>
        <button onclick="renameConversation(event, '${c.id}')">✏️ Rename</button>
        <button class="danger" onclick="deleteConversation(event, '${c.id}')">🗑️ Delete</button>
      </div>
    </div>`;

  const now = new Date();
  const startOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const today = startOf(now);
  const yesterday = today - 86400000;
  const weekAgo = today - 7 * 86400000;

  const pinned = filtered.filter(c => c.pinned);
  const rest = filtered.filter(c => !c.pinned);

  const groups = { Pinned: pinned, Today: [], Yesterday: [], 'Previous 7 days': [], Older: [] };
  rest.forEach(c => {
    const day = startOf(new Date(c.updatedAt));
    if (day === today) groups['Today'].push(c);
    else if (day === yesterday) groups['Yesterday'].push(c);
    else if (day >= weekAgo) groups['Previous 7 days'].push(c);
    else groups['Older'].push(c);
  });

  list.innerHTML = Object.entries(groups)
    .filter(([, items]) => items.length)
    .map(([label, items]) => `
      <div class="history-group ${collapsedGroups[label] ? 'collapsed' : ''}">
        <div class="history-group-label" onclick="toggleGroup('${label}')">${CHEV}${label}</div>
        ${items.map(itemHtml).join('')}
      </div>
    `).join('');
}

function filterHistory(value) {
  renderHistory(value);
}

function loadConversation(id) {
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  currentConvId = id;
  history = JSON.parse(JSON.stringify(conv.messages));
  document.getElementById('messages').innerHTML = "";
  history.forEach(m => addMessage(m.role, m.role === 'user' ? escapeHtml(m.message) : renderMarkdown(m.message)));
  renderHistory(document.getElementById('chat-search').value);
  closeSidebarOnMobile();
  updateTokenCounter();
}

function upsertConversation() {
  if (history.length === 0) return;
  if (!currentConvId) {
    currentConvId = 'c-' + Date.now();
    const firstUserMsg = history.find(m => m.role === 'user');
    conversations.push({
      id: currentConvId,
      title: (firstUserMsg ? firstUserMsg.message : 'New chat').slice(0, 40),
      messages: [],
      pinned: false,
      updatedAt: Date.now()
    });
  }
  const conv = conversations.find(c => c.id === currentConvId);
  conv.messages = JSON.parse(JSON.stringify(history));
  conv.updatedAt = Date.now();
  saveConversations();
  renderHistory(document.getElementById('chat-search').value);
}

loadConversations();
tryRenderSharedView();
updateTokenCounter();

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('hidden');
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar-backdrop').classList.toggle('show', !sidebar.classList.contains('hidden'));
  }
}

function closeSidebarOnMobile() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('sidebar-backdrop').classList.remove('show');
  }
}

function initSidebar() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
  }
}
initSidebar();

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function newChat() {
  history = [];
  extraFileContent = "";
  currentConvId = null;
  document.getElementById('messages').innerHTML = `
    <div id="empty-state">
      <div id="empty-greeting"></div>
      <div id="empty-sub">Ask anything — from quick questions to full documents.</div>
      <div id="suggestion-grid"></div>
    </div>`;
  showEmptyState();
  clearFile();
  renderHistory(document.getElementById('chat-search').value);
  closeSidebarOnMobile();
  updateTokenCounter();
}

function clearFile() {
  extraFileContent = "";
  document.getElementById('file-chip').classList.remove('show');
  document.getElementById('file-input').value = "";
}

async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('file-name').textContent = "Reading " + file.name + "...";
  document.getElementById('file-chip').classList.add('show');

  const formData = new FormData();
  formData.append("file", file);
  try {
    const res = await fetch(API_URL + "/upload", { method: "POST", body: formData });
    const data = await res.json();
    if (data.success) {
      // The backend keeps the extracted document server-side (uploaded_documents)
      // and automatically uses it in /chat - no need to round-trip the text
      // through the client. We just need to know upload succeeded.
      extraFileContent = "uploaded";
      document.getElementById('file-name').textContent = file.name + " attached";
    } else {
      extraFileContent = "";
      document.getElementById('file-name').textContent = data.message || "Could not read file";
    }
  } catch (err) {
    extraFileContent = "";
    document.getElementById('file-name').textContent = "Failed to read file";
  }
}

// ---------- VOICE INPUT ----------
let recognition = null;
let isRecording = false;

function toggleVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Voice input is not supported in this browser. Try Chrome.');
    return;
  }
  const micBtn = document.getElementById('mic-btn');
  if (isRecording) {
    recognition.stop();
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;

  const input = document.getElementById('user-input');
  const baseText = input.value ? input.value + ' ' : '';

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
  };
  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    input.value = baseText + transcript;
    autoGrow(input);
  };
  recognition.onerror = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };
  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };
  recognition.start();
}

const BOT_ICON = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2a1 1 0 0 1 1 1v1.06A8.004 8.004 0 0 1 20 12v1h.5a1.5 1.5 0 0 1 0 3H20v.5A3.5 3.5 0 0 1 16.5 20h-9A3.5 3.5 0 0 1 4 16.5V16h-.5a1.5 1.5 0 0 1 0-3H4v-1a8.004 8.004 0 0 1 7-7.94V3a1 1 0 0 1 1-1Zm-3.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" fill="currentColor"/></svg>`;
const USER_ICON = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.14 0-8 2.13-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.87-3.86-5-8-5Z" fill="currentColor"/></svg>`;
const COPY_ICON = `<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.6"/></svg>`;
const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const DOWNLOAD_ICON = `<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const EXPAND_ICON = `<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderMarkdown(text) {
  marked.setOptions({ gfm: true, breaks: true });
  const html = marked.parse(text || "");
  return html;
}

// Wrap each rendered <pre><code> with a header + copy button, and each <img> with action buttons.
function enhanceBubble(bubbleEl) {
  bubbleEl.querySelectorAll('pre').forEach(pre => {
    if (pre.parentElement.classList.contains('code-block-wrap')) return;
    const codeEl = pre.querySelector('code');
    const lang = (codeEl && [...codeEl.classList].find(c => c.startsWith('language-'))) || '';
    const langLabel = lang ? lang.replace('language-', '') : 'code';

    const wrap = document.createElement('div');
    wrap.className = 'code-block-wrap';
    const header = document.createElement('div');
    header.className = 'code-block-header';
    header.innerHTML = `<span>${escapeHtml(langLabel)}</span>`;
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.setAttribute('data-tooltip', 'Copy code');
    btn.setAttribute('aria-label', 'Copy code block');
    btn.innerHTML = `${COPY_ICON}<span>Copy code</span>`;
    btn.onclick = () => {
      navigator.clipboard.writeText(codeEl ? codeEl.innerText : pre.innerText);
      btn.classList.add('copied');
      btn.innerHTML = `${CHECK_ICON}<span>Copied!</span>`;
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = `${COPY_ICON}<span>Copy code</span>`; }, 1500);
    };
    header.appendChild(btn);

    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(header);
    wrap.appendChild(pre);
  });

  bubbleEl.querySelectorAll('img').forEach(img => {
    if (img.parentElement.classList.contains('img-wrap')) return;
    const wrap = document.createElement('span');
    wrap.className = 'img-wrap';
    img.parentNode.insertBefore(wrap, img);
    wrap.appendChild(img);

    const actions = document.createElement('div');
    actions.className = 'img-actions';

    const copyBtn = document.createElement('button');
    copyBtn.setAttribute('data-tooltip', 'Copy image');
    copyBtn.setAttribute('aria-label', 'Copy image');
    copyBtn.innerHTML = COPY_ICON;
    copyBtn.onclick = async () => {
      try {
        const resp = await fetch(img.src);
        const blob = await resp.blob();
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        copyBtn.innerHTML = CHECK_ICON;
        setTimeout(() => copyBtn.innerHTML = COPY_ICON, 1500);
      } catch (e) {
        window.open(img.src, '_blank');
      }
    };

    const downloadBtn = document.createElement('button');
    downloadBtn.setAttribute('data-tooltip', 'Download image');
    downloadBtn.setAttribute('aria-label', 'Download image');
    downloadBtn.innerHTML = DOWNLOAD_ICON;
    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = img.src;
      a.download = 'image.png';
      a.click();
    };

    const previewBtn = document.createElement('button');
    previewBtn.setAttribute('data-tooltip', 'Open preview');
    previewBtn.setAttribute('aria-label', 'Open image preview');
    previewBtn.innerHTML = EXPAND_ICON;
    previewBtn.onclick = () => window.open(img.src, '_blank');

    actions.appendChild(copyBtn);
    actions.appendChild(downloadBtn);
    actions.appendChild(previewBtn);
    wrap.appendChild(actions);
  });

  if (window.hljs) hljs.highlightAll();
  if (window.renderMathInElement) {
    try {
      renderMathInElement(bubbleEl, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {}
  }
}

const GREETINGS = [
  "What's your agenda today?",
  "What are we working on today?",
  "What's on your mind?",
  "Ready when you are — what's up?",
  "What can I help you figure out today?",
  "What's the plan for today?",
  "Where should we start?",
  "What's next on your list?"
];

const SUGGESTIONS = [
  "Summarize a document I upload",
  "Draft an email for me",
  "Explain a legal term simply",
  "Help me brainstorm ideas"
];

function timeGreetingPrefix() {
  const h = new Date().getHours();
  if (h < 5) return "Up late?";
  if (h < 12) return "Good morning.";
  if (h < 17) return "Good afternoon.";
  if (h < 21) return "Good evening.";
  return "Good evening.";
}

function showEmptyState() {
  const el = document.getElementById('empty-state');
  if (!el) return;
  el.classList.remove('hidden');
  const line = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];
  document.getElementById('empty-greeting').textContent = timeGreetingPrefix() + " " + line;
  const grid = document.getElementById('suggestion-grid');
  const picks = [...SUGGESTIONS].sort(() => Math.random() - 0.5).slice(0, 4);
  grid.innerHTML = picks.map(s => `<div class="suggestion-chip" onclick="useSuggestion('${s.replace(/'/g, "\\'")}')">${escapeHtml(s)}</div>`).join('');
}

function hideEmptyState() {
  const el = document.getElementById('empty-state');
  if (el) el.classList.add('hidden');
}

function useSuggestion(text) {
  const input = document.getElementById('user-input');
  input.value = text;
  autoGrow(input);
  input.focus();
}

showEmptyState();

const REGEN_ICON = `<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><path d="M4 4v5h5M20 20v-5h-5M4.5 15a8 8 0 0 0 14.5 3.5M19.5 9A8 8 0 0 0 5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const STOP_ICON = `<svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>`;
const SEND_ICON_CHAR = '➤';

function addMessage(role, text, forQuery) {
  hideEmptyState();
  const messages = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const bubbleId = 'bubble-' + Date.now() + Math.random().toString(36).slice(2);
  if (forQuery) row.dataset.forQuery = forQuery;

  row.innerHTML = `
    ${role === 'assistant' ? `<div class="avatar assistant">${BOT_ICON}</div>` : ''}
    <div>
      <div class="bubble" id="${bubbleId}">${text}</div>
      ${role === 'assistant' ? `<div class="actions">
        <button data-tooltip="Copy message" aria-label="Copy message" onclick="copyText('${bubbleId}')">${COPY_ICON}<span>Copy</span></button>
        <button data-tooltip="Regenerate response" aria-label="Regenerate response" onclick="regenerateResponse(this)">${REGEN_ICON}<span>Regenerate</span></button>
        <button data-tooltip="Good response" aria-label="Good response">👍</button>
        <button data-tooltip="Bad response" aria-label="Bad response">👎</button>
      </div>` : ''}
    </div>
    ${role === 'user' ? `<div class="avatar user">${USER_ICON}</div>` : ''}
  `;
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
  if (role === 'assistant') enhanceBubble(document.getElementById(bubbleId));
  return bubbleId;
}

function copyText(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.innerText);
  const btn = el.parentElement.querySelector('.actions button[aria-label="Copy message"]');
  if (btn) {
    const original = btn.innerHTML;
    btn.innerHTML = `${CHECK_ICON}<span>Copied!</span>`;
    setTimeout(() => btn.innerHTML = original, 1500);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const DEFAULT_TITLE = document.title;
let currentAbortController = null;

function setStreamingTitle(on) {
  if (on) {
    document.title = "● Generating... — " + DEFAULT_TITLE;
  } else if (document.hidden) {
    document.title = "✓ Response ready — " + DEFAULT_TITLE;
  } else {
    document.title = DEFAULT_TITLE;
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !isStreaming) document.title = DEFAULT_TITLE;
});

function setSendButtonMode(streaming) {
  const btn = document.getElementById('send-btn');
  if (streaming) {
    btn.innerHTML = STOP_ICON;
    btn.classList.add('stop-mode');
    btn.setAttribute('data-tooltip', 'Stop generating');
    btn.disabled = false;
  } else {
    btn.innerHTML = SEND_ICON_CHAR;
    btn.classList.remove('stop-mode');
    btn.setAttribute('data-tooltip', 'Send');
    btn.disabled = false;
  }
}

function sendOrStop() {
  if (isStreaming) {
    if (currentAbortController) currentAbortController.abort();
    return;
  }
  sendMessage();
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('user-input');
  const query = input.value.trim();
  if (!query) return;

  addMessage('user', escapeHtml(query));
  history.push({ role: 'user', message: query });
  input.value = "";
  autoGrow(input);

  await streamAssistantReply(query);
}

async function regenerateResponse(btn) {
  if (isStreaming) return;
  const row = btn.closest('.msg-row');
  const lastUserMsg = [...history].reverse().find(m => m.role === 'user');
  if (!lastUserMsg) return;

  if (history.length && history[history.length - 1].role === 'assistant') {
    history.pop();
  }
  row.remove();

  await streamAssistantReply(lastUserMsg.message);
}

async function streamAssistantReply(query) {
  const bubbleId = addMessage('assistant', '<div class="typing-dots"><span></span><span></span><span></span></div>');
  const bubbleEl = document.getElementById(bubbleId);
  isStreaming = true;
  setSendButtonMode(true);
  setStreamingTitle(true);

  currentAbortController = new AbortController();
  let fullText = "";
  let firstChunk = true;
  let wasAborted = false;

  try {
    const res = await fetch(API_URL + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, history, extra_file_content: extraFileContent, model: selectedModel }),
      signal: currentAbortController.signal
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const jsonStr = line.slice(6);
        try {
          const payload = JSON.parse(jsonStr);
          if (payload.type === "chunk") {
            if (firstChunk) { fullText = ""; firstChunk = false; }
            fullText += payload.text;
            bubbleEl.innerHTML = renderMarkdown(fullText) + '<span class="cursor"></span>';
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
          } else if (payload.type === "done") {
            bubbleEl.innerHTML = renderMarkdown(fullText);
            enhanceBubble(bubbleEl);
          }
        } catch (e) {}
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      wasAborted = true;
      bubbleEl.innerHTML = renderMarkdown(fullText || "_Stopped._");
      enhanceBubble(bubbleEl);
    } else {
      bubbleEl.innerHTML = "⚠️ Could not reach the server. Check API_URL / backend status.";
    }
  }

  history.push({ role: 'assistant', message: fullText });
  isStreaming = false;
  currentAbortController = null;
  setSendButtonMode(false);
  setStreamingTitle(false);
  upsertConversation();
  updateTokenCounter();
}

// ---------- PWA ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
